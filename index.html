
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoyalGame 👑</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
 background:#10250d;
 color:#ffe7a0;
 font-family:Arial,sans-serif;
 background:linear-gradient(160deg,#315b20,#081b09);
 min-height:100vh;
}
header{
 padding:20px;
 display:flex;
 justify-content:space-between;
 align-items:center;
}
.logo{
 font-size:26px;
 font-weight:bold;
 color:#ffcf40;
 text-shadow:0 0 10px #ff9d00;
}
.coin{
 background:#422d13;
 border:1px solid #e9b74c;
 padding:10px 16px;
 border-radius:25px;
}
.profile{
 margin:15px;
 padding:20px;
 background:#183713;
 border:2px solid #9b7135;
 border-radius:20px;
}
.avatar{
 font-size:45px;
}
.name{font-size:22px;font-weight:bold;margin-top:8px}
.level{margin-top:8px;color:#b7dca0}
.menu{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;
 padding:15px;
}
.card{
 background:linear-gradient(#65451f,#39230f);
 border:2px solid #bd8c40;
 border-radius:18px;
 padding:20px 8px;
 text-align:center;
 font-size:17px;
 font-weight:bold;
 box-shadow:0 5px 10px #0005;
 cursor:pointer;
}
.card span{
 display:block;
 font-size:35px;
 margin-bottom:10px;
}
.play{
 margin:15px;
 padding:22px;
 text-align:center;
 background:linear-gradient(#ffdf79,#d89b24);
 color:#422408;
 border-radius:20px;
 font-size:24px;
 font-weight:bold;
}
h3{padding:15px}
footer{
 position:fixed;
 bottom:0;
 width:100%;
 background:#101810;
 display:flex;
 justify-content:space-around;
 padding:15px 5px;
 border-top:1px solid #9b7135;
}
footer div{text-align:center;font-size:13px}
</style>
</head>

<body>

<header>
<div class="logo">👑 RoyalGame</div>
<div class="coin">🪙 <b id="coins">5</b></div>
</header>

<div class="profile">
<div class="avatar">👑</div>
<div class="name" id="player">O‘yinchi</div>
<div class="level">⭐ Level 1 · Yangi o‘yinchi</div>
<p style="margin-top:12px">🆔 ID: <span id="id">10001</span></p>
</div>

<h3>🎮 O‘YINLAR</h3>

<div class="menu">
<div class="card" onclick="game('Shashka')">
<span>♟️</span>Shashka
</div>
<div class="card" onclick="game('Shaxmat')">
<span>♜</span>Shaxmat
</div>
<div class="card" onclick="game('UNO')">
<span>🃏</span>UNO
</div>
<div class="card" onclick="game('Billiard')">
<span>🎱</span>Billiard
</div>
<div class="card" onclick="page('Vazifalar')">
<span>📋</span>Vazifalar
</div>
<div class="card" onclick="page('Reyting')">
<span>🏆</span>Reyting
</div>
<div class="card" onclick="page('Do‘stlar')">
<span>👥</span>Do‘stlar
</div>
<div class="card" onclick="page('Do‘kon')">
<span>🛒</span>Do‘kon
</div>
</div>

<div class="play" onclick="page('O‘yin qidirish')">
▶ O‘YIN O‘YNASH
</div>

<footer>
<div onclick="page('Bosh sahifa')">🏠<br>Bosh</div>
<div onclick="page('Statistika')">📊<br>Statistika</div>
<div onclick="page('Mukofotlar')">🎁<br>Mukofotlar</div>
<div onclick="page('Sozlamalar')">⚙️<br>Sozlamalar</div>
</footer>

<script>
function game(name){
 alert(name+" onlayn o‘yini tez orada!");
}
function page(name){
 alert(name+" bo‘limi tez orada!");
}
</script>

</body>
  </html>
